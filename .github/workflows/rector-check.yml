name: Rector check

on:
  pull_request:
    paths:
      - '**.php'
      - 'rector.php'
      - '.github/workflows/rector-check.yml'

permissions:
  contents: read

concurrency:
  group: rector-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rector-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4 (4.0.0)

      # Restore-only: this workflow runs on pull_request, and a cache saved there lands
      # in the PR's own refs/pull/<n>/merge scope where nothing else can read it. The
      # entry this restores is published by auto-fix.yml on push to `main`. See the
      # notes there for why the key is commit-based and why `.cache/rectorContainer/`
      # is no longer cached.
      - name: Restore Rector result cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/rector/
          key: rector-result-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            rector-result-cache-${{ runner.os }}-

      - name: Ensure Rector cache directories exist
        run: mkdir -p .cache/rector .cache/rectorContainer

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run
