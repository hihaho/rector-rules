name: Auto-fix

on:
  push:
    paths:
      - '**.php'
      - 'rector.php'
      - 'pint.json'
      - '.github/workflows/auto-fix.yml'

permissions:
  contents: write

concurrency:
  group: auto-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Push-only workflow: head_ref is only set on pull_request events,
          # which we don't trigger on. ref_name is always the pushed branch
          # in our own repo, so there's no untrusted-fork surface here.
          ref: ${{ github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4 (4.0.0)

      # Split restore/save, keyed on the commit, saved only on `main` — see the note in
      # phpstan.yml for the full rationale. In short: actions/cache never overwrites a
      # key, so keying on rector.php (a file that changes a few times a year) meant the
      # entry was written once and only ever restored, freezing Rector's result cache;
      # and a cache written on a topic-branch push is not readable by the PR checks.
      # This workflow is the only one that runs Rector on a push to `main`, so it is
      # where the shared entry gets published; rector-check.yml restores it.
      #
      # `.cache/rectorContainer/` is deliberately no longer cached. Timed locally on
      # this repo against the locked versions, min of 5 runs each: `rector process
      # --dry-run` takes 6.4s cold, 3.1s with only `.cache/rector/` (744 KB) restored,
      # and 2.7s with the 29 MB container directory restored on top. Trading 29 MB of
      # download-and-upload for that last ~0.5s is a net loss once transfer is counted;
      # restoring the old combined cache measured ~1s in CI, and saving it costs more.
      # The container's own `nette.configurator` subdirectory could never hit anyway,
      # for the environment-keyed reason described in phpstan.yml.
      - name: Restore Rector result cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/rector/
          key: rector-result-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            rector-result-cache-${{ runner.os }}-

      # Left on a stable key, unlike the Rector cache above and PHPStan's. Pint's cache
      # measures 28 KB, so the frozen-entry problem costs it about a second of
      # re-checking across ~110 files — not worth two more steps and a rotating entry
      # per push to fix.
      - name: Cache Pint results
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/pint/
          key: pint-cache-${{ hashFiles('pint.json') }}
          restore-keys: pint-cache-

      - name: Ensure Rector cache directories exist
        run: mkdir -p .cache/rector .cache/rectorContainer

      - name: Run Rector
        run: vendor/bin/rector process --no-diffs

      # Saved here rather than at the end of the job: this is the state that lands on
      # `main` (Rector has already applied its fixes), and it should still be published
      # if a later step fails.
      - name: Save Rector result cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/rector/
          key: rector-result-cache-${{ runner.os }}-${{ github.sha }}

      - name: Run Pint
        uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6
        with:
          configPath: pint.json
          verboseMode: true

      # Guard: never commit an auto-fix that breaks static analysis. Rector/Pint run in a
      # clean CI environment (fresh cache, PHP 8.4) and have produced output that fails
      # PHPStan level max — e.g. adding a contravariant `@param` to a rule's refactor()
      # override. Those commits used to land on `main` unverified, because a bot push does
      # not trigger the PHPStan workflow. Analyse the fixed tree here; if it fails, discard
      # the changes so the commit step has nothing to commit (the run stays green, main
      # stays clean) instead of shipping a broken auto-fix.
      - name: Discard auto-fixes that fail PHPStan
        run: |
          if vendor/bin/phpstan analyse --no-progress --memory-limit=2G; then
            echo "PHPStan passed — auto-fix changes (if any) will be committed."
          else
            echo "::warning::Auto-fix changes fail PHPStan — discarding them; nothing will be committed."
            git reset --hard HEAD
          fi

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: 'chore: auto-fix'
